services:
  - type: web
    name: quantum-terminal-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: sh -c "uvicorn backend.app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGIN_REGEX
        value: "https://.*(vercel\\.app|onrender\\.com|netlify\\.app|railway\\.app)"
      - key: CORS_ORIGINS
        value: "https://trading07-lx1o.vercel.app"
      - key: SKIP_AUTO_BUILD
        value: "1"
      - key: PYTHONPATH
        value: "."
