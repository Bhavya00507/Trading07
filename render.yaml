services:
  - type: web
    name: quantum-terminal-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGIN_REGEX
        value: "https://.*(vercel\\.app|onrender\\.com|netlify\\.app|railway\\.app)"
